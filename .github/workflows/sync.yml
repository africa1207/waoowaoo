name: Sync fork

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork
        run: |
          gh repo sync ${{ github.repository }} --force
        env:
          GH_TOKEN: ${{ github.token }}
